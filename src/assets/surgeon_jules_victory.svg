  <title id="jules-victory-title">Dr. Jules Okafor, victorious artery surgeon</title>
  <desc id="jules-victory-desc">A tall early-career surgeon with a long narrow silhouette, close curls and a lifted chin. A competitive ballroom dancer who counts the beat under their breath. Masked and gloved, with an upward delivery applicator. Opens a ballroom dance frame for a triumphant final count. Fictional Plaque Attack character.</desc>
