  <title id="jules-victory-title">Dr. Jules Okafor, victorious artery surgeon</title>
  <desc id="jules-victory-desc">The tallest surgeon, with a small curled head, upright narrow violet torso and conspicuously long straight legs. A quiet palm-to-temple salute celebrates success. Masked and gloved, holding an upward delivery applicator. Fictional Plaque Attack character.</desc>
