<title id="scene-healed-flow-title">Quiet flow past a retained implant</title>
<desc id="scene-healed-flow-desc">Original stylized longitudinal artery interior with folded muscular tissue, a translucent lining and distant vessel forms. Decorative art leaves the gameplay lumen open. Anatomy and cell sizes are simplified, not to scale. The metal implant remains beneath a smoother surface; the scene does not imply disease cure.</desc>
