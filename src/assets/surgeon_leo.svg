  <title id="leo-title">Dr. Leo Rivera, artery surgeon</title>
  <desc id="leo-desc">A middle-aged surgeon with a high bald crown, silver temples, rectangular glasses and a rounded pear-shaped torso. Repairs old radios and listens for distant stations. Masked and gloved, with an upward delivery applicator. Fictional Plaque Attack character.</desc>
