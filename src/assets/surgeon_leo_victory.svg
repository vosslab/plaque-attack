<svg xmlns="http://www.w3.org/2000/svg" width="96" height="128" viewBox="0 0 96 128" role="img" aria-labelledby="leo-victory-title leo-victory-desc">
  <title id="leo-victory-title">Dr. Leo Rivera, victorious artery surgeon</title>
  <desc id="leo-victory-desc">A middle-aged surgeon with a high bald crown, silver temples, rectangular glasses and a rounded pear-shaped torso. Repairs old radios and listens for distant stations. Masked and gloved, with an upward delivery applicator. Cups an ear to catch the applause like a distant radio station. Fictional Plaque Attack character.</desc>
