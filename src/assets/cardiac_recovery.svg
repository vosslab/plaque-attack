<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-labelledby="cardiac-recovery-title cardiac-recovery-desc">
  <title id="cardiac-recovery-title">Coronary recovery circuit</title>
  <desc id="cardiac-recovery-desc">A warm brown-skinned patient with a silver-streaked forelock returns from seated rest to joyful purposeful walking across five selectable states. The unchanged stylized heart and coronary vessels support a twenty-four-stage arcade recovery map, rather than a claim of medical cure.</desc>
  <defs>
    <linearGradient id="recovery-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#211d37"/><stop offset=".5" stop-color="#351f3c"/><stop offset="1" stop-color="#172b3a"/>
    </linearGradient>
    <radialGradient id="recovery-heart" cx="36%" cy="24%" r="80%">
      <stop stop-color="#ff8491"/><stop offset=".52" stop-color="#d34f70"/><stop offset="1" stop-color="#7d294d"/>
    </radialGradient>
    <linearGradient id="recovery-coat" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e6f4f2"/><stop offset="1" stop-color="#9bc8cc"/></linearGradient>
    <linearGradient id="recovery-vessel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4a4a6"/><stop offset="1" stop-color="#9d355c"/></linearGradient>
    <filter id="recovery-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
    <pattern id="recovery-fibers" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)"><path d="M0 4h24M0 15h24" stroke="#ffd0d2" stroke-opacity=".13" stroke-width="4"/></pattern>
    <g id="recovery-cell"><circle r="8" fill="#f49b9f"/><circle r="3" fill="#7e3555"/></g>

    <!-- Identity anchors persist through every pose: swept forelock, silver lock,
         broad nose, warm skin and one gold ear stud. Facial action is state-owned. -->
    <g id="recovery-patient-head" stroke="#342237" stroke-width="5" stroke-linejoin="round">
      <ellipse cx="-49" cy="9" rx="12" ry="18" fill="#a3644b"/>
      <ellipse cx="49" cy="9" rx="12" ry="18" fill="#a3644b"/>
      <path d="M-48-25Q-48-63 0-62Q52-61 50-15L45 28Q39 65 4 70Q-33 67-43 34Z" fill="#a3644b"/>
      <path d="M-37-26Q-34 8-35 28Q-29 51-13 55Q-35 48-39 20Z" fill="#c58561" stroke="none"/>
      <path d="M-51 0Q-69-56-28-72Q-9-93 18-72Q65-73 60-20L48 4L37-32Q5-32-10-48Q-22-17-51 0Z" fill="#302334"/>
      <path d="M-19-70Q-36-55-36-26L-24-37Q-22-56-7-65Z" fill="#b5b3ae" stroke="none"/>
      <path d="M8 2L3 24L14 26" fill="none" stroke="#653747" stroke-linecap="round"/>
      <circle cx="-51" cy="25" r="5" fill="#e9c77b" stroke="none"/>
    </g>
    <g id="recovery-patient-face-rest" fill="none" stroke="#342237" stroke-width="5" stroke-linecap="round">
      <path d="M-32-5L-13-9M22-10L39-3M-30 8q8 5 16-1M22 7q8 5 15 1M-11 47q13-8 27-2"/>
    </g>
    <g id="recovery-patient-face-alert" stroke="#342237" stroke-width="5" stroke-linecap="round">
      <path d="M-31-10q9-5 19-1M21-11q10-3 18 3" fill="none"/>
      <ellipse cx="-21" cy="7" rx="4" ry="6" fill="#251f31" stroke="none"/>
      <ellipse cx="30" cy="7" rx="4" ry="6" fill="#251f31" stroke="none"/>
      <path d="M-10 43q13 10 27-1" fill="none"/>
    </g>
    <g id="recovery-patient-face-joy" stroke="#342237" stroke-width="5" stroke-linecap="round">
      <path d="M-32-12q10-5 20-1M21-14q10-3 19 4M-30 8q9-12 18 0M21 7q9-12 18 0" fill="none"/>
      <path d="M-13 39Q2 49 23 37Q20 60 4 60Q-7 57-13 39Z" fill="#5a2d40"/>
      <path d="M-8 42Q5 47 18 41L15 48Q3 52-5 48Z" fill="#fff0d4" stroke="none"/>
    </g>
    <g id="recovery-patient-seedling" stroke="#34313c" stroke-width="4" stroke-linejoin="round">
      <path d="M-25 0L-18 38Q1 46 20 37L28 0Z" fill="#cf7d60"/>
      <ellipse cy="0" rx="28" ry="9" fill="#714d49"/>
      <path d="M2 0Q-3-28 3-57" fill="none" stroke="#8bc7a0" stroke-width="6"/>
      <path d="M1-23Q-31-18-31-47Q-2-49 1-23M3-39Q8-70 33-62Q36-36 3-39" fill="#9bc8a2"/>
    </g>

    <!-- Rest, reconnection, first walk, purposeful movement, return to everyday joy. -->
<symbol id="recovery-patient-tier-0" viewBox="0 0 1000 640"><title>Resting, folded forward in a chair</title><g stroke="#342237" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="208" cy="575" rx="150" ry="20" fill="#101929" stroke="none" opacity=".55"/><g fill="#6d6374"><path d="M84 349Q74 331 61 343L63 458Q67 481 92 483H253V454H99Z"/><path d="M84 479L71 565M245 481L264 565" fill="none" stroke="#777282" stroke-width="13"/></g><path d="M134 434Q170 416 225 441L255 537L231 547L188 477L143 481Z" fill="#364961"/><path d="M181 458L175 546H143L136 464" fill="#465d74"/><path d="M140 537L173 537L189 557Q189 569 172 570H124Q117 552 140 537M231 535L256 531L281 549Q291 562 276 566L231 567L222 555Z" fill="#e7d6ba"/><path d="M145 331Q178 315 216 341Q244 377 220 446Q174 462 117 439L120 375Z" fill="#4c9291"/><path d="M174 336L202 340L207 437L163 441Z" fill="#ce7c67"/><path d="M148 335L175 367L164 416M216 349L195 368L207 421" fill="none" stroke="#a8cfbd" stroke-width="5"/><path d="M129 363Q116 399 145 423L199 441M219 365Q242 399 222 435L199 441" fill="none" stroke="#4c9291" stroke-width="31"/><path d="M178 437L201 444L222 438" fill="none" stroke="#a3644b" stroke-width="21"/><path d="M170 324L168 346Q181 360 195 345L199 319" fill="#a3644b"/><g transform="translate(182 275) rotate(13)"><use href="#recovery-patient-head"/><use href="#recovery-patient-face-rest"/></g></g></symbol><symbol id="recovery-patient-tier-1" viewBox="0 0 1000 640"><title>Sitting upright, opening a hand to the day</title><g stroke="#342237" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="208" cy="575" rx="150" ry="20" fill="#101929" stroke="none" opacity=".55"/><g fill="#6d6374"><path d="M84 349Q74 331 61 343L63 458Q67 481 92 483H253V454H99Z"/><path d="M84 479L71 565M245 481L264 565" fill="none" stroke="#777282" stroke-width="13"/></g><path d="M134 434Q170 416 225 441L255 537L231 547L188 477L143 481Z" fill="#364961"/><path d="M181 458L175 546H143L136 464" fill="#465d74"/><path d="M140 537L173 537L189 557Q189 569 172 570H124Q117 552 140 537M231 535L256 531L281 549Q291 562 276 566L231 567L222 555Z" fill="#e7d6ba"/><path d="M132 305Q179 281 220 309L226 438Q180 454 121 438Z" fill="#4c9291"/><path d="M167 302H194L203 439H157Z" fill="#ce7c67"/><path d="M139 309L168 341L156 413M214 312L194 340L202 408" fill="none" stroke="#a8cfbd" stroke-width="5"/><path d="M135 332Q107 376 136 415L166 430M214 334Q241 373 279 346" fill="none" stroke="#4c9291" stroke-width="30"/><path d="M155 426L177 432M271 351L289 337L284 323M289 337L306 331" fill="none" stroke="#a3644b" stroke-width="18"/><path d="M166 286V310Q182 325 197 310V282" fill="#a3644b"/><g transform="translate(181 232) rotate(0)"><use href="#recovery-patient-head"/><use href="#recovery-patient-face-alert"/></g></g></symbol><symbol id="recovery-patient-tier-2" viewBox="0 0 1000 640"><title>First walk, cautious short stride</title><g stroke="#342237" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="208" cy="575" rx="150" ry="20" fill="#101929" stroke="none" opacity=".55"/><path d="M164 428L150 541L177 549L203 453L223 541L250 537L237 419Z" fill="#40556d"/><path d="M147 538L177 542L186 560Q180 572 160 573H127Q121 552 147 538M222 536L251 534L280 552Q285 565 271 570H223L214 557Z" fill="#e7d6ba"/><g transform="translate(205 285)"><path d="M-55 6Q-25-15 15-10L47 15L53 142Q1 162-66 141Z" fill="#4c9291"/><path d="M-25 0L5-3L18 143L-32 148Z" fill="#ce7c67"/><path d="M-45 6L-22 31L-31 116M25 0L5 30L16 116" fill="none" stroke="#a8cfbd" stroke-width="5"/><path d="M-22-20L-24 4Q-7 22 8 1L9-24" fill="#a3644b"/></g><path d="M153 313Q121 349 134 393L154 418M244 309Q276 341 263 381L283 397" fill="none" stroke="#4c9291" stroke-width="30"/><path d="M149 408L161 427M276 389L289 402" stroke="#a3644b" stroke-width="20"/><g transform="translate(198 220) rotate(-4)"><use href="#recovery-patient-head"/><use href="#recovery-patient-face-alert"/></g></g></symbol><symbol id="recovery-patient-tier-3" viewBox="0 0 1000 640"><title>Walking with a new shoot to tend</title><g stroke="#342237" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="208" cy="575" rx="150" ry="20" fill="#101929" stroke="none" opacity=".55"/><path d="M163 422L129 531L155 547L205 452L238 542L267 529L241 417Z" fill="#40556d"/><path d="M128 528L154 539L162 559Q158 571 138 571H108Q97 550 128 528M238 535L264 524L296 544Q308 559 291 566L247 572L231 558Z" fill="#e7d6ba"/><g transform="translate(204 268)"><path d="M-55 6Q-25-15 15-10L47 15L53 142Q1 162-66 141Z" fill="#4c9291"/><path d="M-25 0L5-3L18 143L-32 148Z" fill="#ce7c67"/><path d="M-45 6L-22 31L-31 116M25 0L5 30L16 116" fill="none" stroke="#a8cfbd" stroke-width="5"/><path d="M-22-20L-24 4Q-7 22 8 1L9-24" fill="#a3644b"/></g><path d="M149 294Q117 327 127 365L152 384M242 293Q268 319 275 350L308 352" fill="none" stroke="#4c9291" stroke-width="31"/><path d="M145 379L162 390M296 352L318 353" stroke="#a3644b" stroke-width="22"/><use href="#recovery-patient-seedling" transform="translate(311 328) scale(.82)"/><g transform="translate(201 199) rotate(-3)"><use href="#recovery-patient-head"/><use href="#recovery-patient-face-alert"/></g></g></symbol><symbol id="recovery-patient-tier-4" viewBox="0 0 1000 640"><title>Returning to a purposeful, joyful stride</title><g stroke="#342237" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="208" cy="575" rx="150" ry="20" fill="#101929" stroke="none" opacity=".55"/><path d="M165 416L100 525L127 543L208 451L257 529L285 512L238 409Z" fill="#40556d"/><path d="M101 520L130 538L135 555Q126 571 108 570L75 558Q70 536 101 520M255 523L281 508L313 526Q326 539 313 553L271 563L251 549Z" fill="#e7d6ba"/><g transform="translate(204 255)"><path d="M-55 6Q-25-15 15-10L47 15L53 142Q1 162-66 141Z" fill="#4c9291"/><path d="M-25 0L5-3L18 143L-32 148Z" fill="#ce7c67"/><path d="M-45 6L-22 31L-31 116M25 0L5 30L16 116" fill="none" stroke="#a8cfbd" stroke-width="5"/><path d="M-22-20L-24 4Q-7 22 8 1L9-24" fill="#a3644b"/></g><path d="M148 282Q115 286 95 257L76 218M242 280Q274 309 282 333L316 337" fill="none" stroke="#4c9291" stroke-width="31"/><path d="M81 227L69 207L73 185M69 207L54 196M306 337L328 336" fill="none" stroke="#a3644b" stroke-width="20"/><use href="#recovery-patient-seedling" transform="translate(322 312) scale(.9)"/><g transform="translate(203 184) rotate(-6)"><use href="#recovery-patient-head"/><use href="#recovery-patient-face-joy"/></g></g></symbol>
  </defs>
  <rect width="1000" height="640" rx="40" fill="url(#recovery-bg)"/>
  <g opacity=".24" fill="none" stroke="#70d3c6" stroke-width="1"><path d="M45 84C190 20 306 88 386 30S614 15 738 82s159 65 225 7"/><path d="M20 560c127-74 241-38 340 15s217 31 317-27 218-76 309-15"/></g>
