    <path d="M52 572L47 554M59 571L68 548M354 577L349 556M362 578L373 562" fill="none" stroke="#819f95" stroke-width="5"/>
    <ellipse cx="79" cy="596" rx="16" ry="4" fill="#b8b29b" opacity=".55"/>
    <ellipse cx="327" cy="597" rx="24" ry="5" fill="#b8b29b" opacity=".4"/>
  </g>
  <g aria-label="Heart recovery illustration">
    <ellipse cx="657" cy="561" rx="216" ry="29" fill="#0c1427" opacity=".45"/>
    <path d="M581 99c-10-47 8-75 45-75 49 0 43 62 35 112m-2-3c6-79 47-103 82-81 30 20 19 72-17 117" fill="none" stroke="#e7bcc2" stroke-width="34" stroke-linecap="round"/>
    <path d="M563 160c-59-86-97-73-113-42-18 37 21 74 93 126" fill="none" stroke="#c65b75" stroke-width="28" stroke-linecap="round"/>
    <path d="M604 141c51-42 100-38 136-10 49 39 76 114 54 218-23 111-100 191-166 214-55-18-130-98-152-194-25-109 4-174 49-212 25-21 50-26 79-22z" fill="url(#recovery-heart)" stroke="#401c42" stroke-width="8"/>
    <path d="M604 141c51-42 100-38 136-10 49 39 76 114 54 218-23 111-100 191-166 214-55-18-130-98-152-194-25-109 4-174 49-212 25-21 50-26 79-22z" fill="url(#recovery-fibers)"/>
    <path d="M614 161c-32 65-32 150 4 262M684 154c39 72 43 164 3 305M534 253c84 33 169 40 243 4M503 347c90 38 190 35 278-14M522 437c70 36 152 35 222-10" fill="none" stroke="#8e3055" stroke-opacity=".52" stroke-width="13" stroke-linecap="round"/>
