  <title id="imani-victory-title">Dr. Imani Patel, victorious artery surgeon</title><desc id="imani-victory-desc">A friendly dark-skinned surgeon in a berry surgical hijab and sea-green scrubs, with pale gloves and a raised stent applicator. Fictional arcade character. Celebrating with a raised gloved fist, smiling eyes, and both feet planted.</desc>
