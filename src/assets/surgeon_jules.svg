  <title id="jules-title">Dr. Jules Okafor, artery surgeon</title><desc id="jules-desc">A friendly dark-skinned surgeon with natural curls under a plum cap, violet scrubs, pale gloves, and an upward stent applicator. Fictional arcade character.</desc>
