  <title id="jules-title">Dr. Jules Okafor, artery surgeon</title>
  <desc id="jules-desc">A tall early-career surgeon with a long narrow silhouette, close curls and a lifted chin. A competitive ballroom dancer who counts the beat under their breath. Masked and gloved, with an upward delivery applicator. Fictional Plaque Attack character.</desc>
