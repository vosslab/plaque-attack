  <title id="alex-victory-title">Dr. Alex Morgan, victorious artery surgeon</title><desc id="alex-victory-desc">A friendly East Asian surgeon with a short dark haircut, round protective glasses, green scrubs, pale gloves, and a raised stent applicator. Fictional arcade character. Celebrating with a raised gloved fist, smiling eyes, and both feet planted.</desc>
