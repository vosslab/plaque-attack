  <title id="samira-victory-title">Dr. Samira Haddad, victorious artery surgeon</title>
  <desc id="samira-victory-desc">A tall middle-aged surgeon with a swept silver crop, angular face and wide offset stance. Collects antique medical instruments and tells their improbable histories. Masked and gloved, with an upward delivery applicator. Presents the result with the open palm of an enthusiastic museum guide. Fictional Plaque Attack character.</desc>
