  <title id="maya-victory-title">Dr. Maya Chen, victorious artery surgeon</title>
  <desc id="maya-victory-desc">A short older surgeon with a silver curled crown, coral cap band and round cheeks. A community choir conductor who sneaks extra encores. Masked and gloved, with an upward delivery applicator. Gives the choir a crisp one-more-encore conducting cue. Fictional Plaque Attack character.</desc>
