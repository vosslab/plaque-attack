  <title id="maya-victory-title">Dr. Maya Chen, victorious artery surgeon</title><desc id="maya-victory-desc">A friendly brown-skinned surgeon with a coral surgical cap, navy scrubs, pale gloves, and a raised stent applicator. Fictional arcade character. Celebrating with a raised gloved fist, smiling eyes, and both feet planted.</desc>
