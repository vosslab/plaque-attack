  <title id="samira-title">Dr. Samira Haddad, artery surgeon</title>
  <desc id="samira-desc">A rose-scarved surgeon leans into a broad asymmetrical stance, one knee angled outward and the opposite hip planted. An elbow on the hip creates a clear angular gap. Masked and gloved, holding an upward delivery applicator. Fictional Plaque Attack character.</desc>
