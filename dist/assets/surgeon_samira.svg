  <title id="samira-title">Dr. Samira Haddad, artery surgeon</title>
  <desc id="samira-desc">A tall middle-aged surgeon with a swept silver crop, angular face and wide offset stance. Collects antique medical instruments and tells their improbable histories. Masked and gloved, with an upward delivery applicator. Fictional Plaque Attack character.</desc>
