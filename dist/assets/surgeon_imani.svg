  <title id="imani-title">Dr. Imani Patel, artery surgeon</title>
  <desc id="imani-desc">A broad-shouldered older surgeon with rectangular gold glasses, silver eyebrows and a close berry head covering. An amateur astronomer who names every telescope. Masked and gloved, with an upward delivery applicator. Fictional Plaque Attack character.</desc>
