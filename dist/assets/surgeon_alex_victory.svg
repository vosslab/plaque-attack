  <title id="alex-victory-title">Dr. Alex Morgan, victorious artery surgeon</title>
  <desc id="alex-victory-desc">A stocky early-career surgeon with a low soft cap, broad freckled face and relaxed shoulders. A balcony gardener whose prize tomato is named Gerald. Masked and gloved, with an upward delivery applicator. Raises a proud green-thumb thumbs-up for a job well grown. Fictional Plaque Attack character.</desc>
