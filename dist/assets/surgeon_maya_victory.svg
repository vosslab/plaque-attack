  <title id="maya-victory-title">Dr. Maya Chen, victorious artery surgeon</title>
  <desc id="maya-victory-desc">A compact rounded surgeon with a low coral cap, broad short cobalt torso and relaxed planted feet. A small close thumbs-up celebrates success. Masked and gloved, holding an upward delivery applicator. Fictional Plaque Attack character.</desc>
