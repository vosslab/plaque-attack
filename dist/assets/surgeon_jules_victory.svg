  <title id="jules-victory-title">Dr. Jules Okafor, victorious artery surgeon</title><desc id="jules-victory-desc">A friendly dark-skinned surgeon with natural curls under a plum cap, violet scrubs, pale gloves, and a raised stent applicator. Fictional arcade character. Celebrating with a raised gloved fist, smiling eyes, and both feet planted.</desc>
