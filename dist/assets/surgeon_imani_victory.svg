  <title id="imani-victory-title">Dr. Imani Patel, victorious artery surgeon</title>
  <desc id="imani-victory-desc">A broad-shouldered older surgeon with rectangular gold glasses, silver eyebrows and a close berry head covering. An amateur astronomer who names every telescope. Masked and gloved, with an upward delivery applicator. Points skyward as if spotting a newly discovered star. Fictional Plaque Attack character.</desc>
