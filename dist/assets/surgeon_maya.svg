  <title id="maya-title">Dr. Maya Chen, artery surgeon</title>
  <desc id="maya-desc">A short older surgeon with a silver curled crown, coral cap band and round cheeks. A community choir conductor who sneaks extra encores. Masked and gloved, with an upward delivery applicator. Fictional Plaque Attack character.</desc>
