  <title id="alex-title">Dr. Alex Morgan, artery surgeon</title>
  <desc id="alex-desc">A stocky early-career surgeon with a low soft cap, broad freckled face and relaxed shoulders. A balcony gardener whose prize tomato is named Gerald. Masked and gloved, with an upward delivery applicator. Fictional Plaque Attack character.</desc>
