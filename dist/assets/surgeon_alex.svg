  <title id="alex-title">Dr. Alex Morgan, artery surgeon</title><desc id="alex-desc">A friendly East Asian surgeon with a short dark haircut, round protective glasses, green scrubs, pale gloves, and an upward stent applicator. Fictional arcade character.</desc>
